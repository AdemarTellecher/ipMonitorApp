<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Monitor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="window-container">
        <!-- Header -->
        <header class="app-header">
            <div class="app-branding">
                <div class="brand-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                        <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                        <line x1="6" y1="6" x2="6.01" y2="6"></line>
                        <line x1="6" y1="18" x2="6.01" y2="18"></line>
                    </svg>
                </div>
                <div>
                    <h1 class="app-title">IP Monitor</h1>
                    <span class="app-badge">v2.0 • Live Ping</span>
                </div>
            </div>

            <button id="themeToggleBtn" class="theme-toggle-btn" title="Alternar tema">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <span>Tema</span>
            </button>
        </header>

        <!-- Conteúdo Principal -->
        <main class="app-content">
            <!-- Cards de Métricas -->
            <section class="metrics-grid">
                <div class="metric-card total">
                    <div class="metric-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    </div>
                    <div class="metric-data">
                        <span class="metric-label">TOTAL</span>
                        <span id="metricTotal" class="metric-value">0</span>
                    </div>
                </div>

                <div class="metric-card online">
                    <div class="metric-icon">
                        <span class="status-pulse-green"></span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                    <div class="metric-data">
                        <span class="metric-label">ONLINE</span>
                        <span id="metricOnline" class="metric-value text-green">0</span>
                    </div>
                </div>

                <div class="metric-card offline">
                    <div class="metric-icon">
                        <span class="status-pulse-red"></span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </div>
                    <div class="metric-data">
                        <span class="metric-label">OFFLINE</span>
                        <span id="metricOffline" class="metric-value text-red">0</span>
                    </div>
                </div>
            </section>

            <!-- Ações Rápidas -->
            <section class="card-section actions-panel">
                <div class="section-title">
                    <span>AÇÕES RÁPIDAS</span>
                </div>
                <div class="input-action-bar">
                    <div class="input-wrapper">
                        <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="ipInput" placeholder="Digite o IP (ex: 192.168.1.1)" class="ip-input">
                    </div>
                    <button id="addBtn" class="btn btn-primary">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Adicionar
                    </button>
                </div>
                <div class="action-buttons-toolbar">
                    <button id="refreshBtn" class="btn btn-secondary">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                        Atualizar Todos
                    </button>
                    <button id="importBtn" class="btn btn-outline">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Importar JSON
                    </button>
                    <input type="file" id="fileInput" accept=".json" style="display: none;">
                    <button id="removeBtn" class="btn btn-danger-subtle" disabled>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        Remover
                    </button>
                </div>
            </section>

            <!-- Tabela de Hosts -->
            <section class="card-section hosts-panel">
                <div class="section-title">
                    <span>HOSTS MONITORADOS</span>
                </div>
                <div class="custom-table-header">
                    <div class="col-ip">ENDEREÇO IP / HOST</div>
                    <div class="col-status">ESTADO</div>
                </div>
                <div id="hostsList" class="custom-table-body">
                    <!-- Gerado dinamicamente via app.js -->
                </div>
            </section>
        </main>

        <!-- Rodapé -->
        <footer class="app-footer">
            <div class="footer-status">
                <span class="ping-rate-dot"></span>
                <span>Varredura automática ativa (1m)</span>
            </div>
            <span id="footerDbStatus">SQLite OK</span>
        </footer>
    </div>

    <!-- Feedback Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
