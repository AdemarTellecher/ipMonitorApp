<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <defs>
        <!-- Gradiente moderno azul celeste para o pin -->
        <linearGradient id="ipPinGrad" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <!-- Brilho do anel interno -->
        <linearGradient id="ipRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
        </linearGradient>
        <!-- Sombra suave para profundidade -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284c7" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Ponto de pulso inferior (sinal de rede/ping) -->
    <ellipse cx="50" cy="91" rx="7" ry="2.8" fill="#38bdf8" opacity="0.8"/>
    <ellipse cx="50" cy="91" rx="11" ry="4" stroke="#38bdf8" stroke-width="1" opacity="0.35"/>

    <!-- Pin de Localização / Ping com gradiente -->
    <path d="M50 82 C38 67 24 53 24 38 A26 26 0 1 1 76 38 C76 53 62 67 50 82 Z"
          fill="url(#ipPinGrad)"
          filter="url(#glow)"/>

    <!-- Anel Externo Branco/Translúcido -->
    <circle cx="50" cy="38" r="19" fill="#0f172a" stroke="url(#ipRingGrad)" stroke-width="2.5"/>

    <!-- Anel Interno de Radar -->
    <circle cx="50" cy="38" r="14.5" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 1.5" opacity="0.85"/>

    <!-- Tipografia "IP" elegante e em negrito centralizada -->
    <text x="50" y="44.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif"
          font-size="14.5"
          font-weight="900"
          letter-spacing="0.5"
          fill="#ffffff"
          text-anchor="middle">IP</text>
</svg>
